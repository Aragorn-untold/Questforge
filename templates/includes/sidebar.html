<header class="site-nav">
  <nav class="site-nav-inner" aria-label="Main navigation">
    <a class="site-brand" href="{% url 'home' %}">
      <span class="site-brand-mark" aria-hidden="true">✧</span>
      <span>QuestForge</span>
    </a>

    <div class="site-nav-links">
      <a class="site-nav-link{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" href="{% url 'home' %}">Home</a>
      <a class="site-nav-link{% if request.resolver_match.app_name == 'campaigns' %} is-active{% endif %}" href="{% url 'campaigns:campaign-list' %}">Campaigns</a>
      <a class="site-nav-link{% if request.resolver_match.app_name == 'chats' %} is-active{% endif %}" href="{% url 'chats:chats-message-list' %}">Tavern</a>
      <a class="site-nav-link{% if request.resolver_match.app_name == 'items' %} is-active{% endif %}" href="{% url 'items:item-list' %}">Items</a>
      <a class="site-nav-link{% if request.resolver_match.app_name == 'quests' %} is-active{% endif %}" href="{% url 'quests:quest-list' %}">Quests</a>
      <a class="site-nav-link{% if request.resolver_match.app_name == 'monsters' %} is-active{% endif %}" href="{% url 'monsters:monster-list' %}">Monsters</a>
      {% if request.user.is_staff %}
        <a class="site-nav-link{% if request.resolver_match.app_name == 'accounts' %} is-active{% endif %}" href="{% url 'accounts:user-list' %}">Users</a>
      {% endif %}
    </div>

    <div class="site-nav-account">
      {% if request.user.is_authenticated %}
        <a class="site-user-pill" href="{{ request.user.get_absolute_url }}">
          <span class="site-user-avatar" aria-hidden="true">{{ request.user.username|first|upper }}</span>
          <span>{{ request.user.get_username }}</span>
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" class="site-logout-form">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="site-logout-link">Log out</button>
        </form>
      {% else %}
        <a class="site-login-link" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">Log in</a>
        <a class="site-register-link" href="{% url 'accounts:user-register' %}">Register</a>
      {% endif %}
    </div>
  </nav>
</header>
