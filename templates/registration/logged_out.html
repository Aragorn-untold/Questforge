{% extends "base.html" %}

{% block title %}<title>Logged out | Questforge</title>{% endblock %}

{% block content %}
  <main class="container py-5 auth-page">
    <div class="auth-card card border-0 shadow-sm mx-auto text-center">
      <div class="card-body p-4 p-lg-5">
        <div class="auth-mark mb-3" aria-hidden="true">✧</div>
        <span class="directory-eyebrow">Session ended</span>
        <h1 class="h2 mt-2">You’re logged out</h1>
        <p class="text-muted mb-4">Your next adventure will be here when you return.</p>
        <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in again</a>
      </div>
    </div>
  </main>
{% endblock %}
